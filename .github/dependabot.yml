# Opens one pull request a month per ecosystem with every outdated npm package or
# GitHub Action in it, majors included. CI runs on it like on any other pull
# request, so a merge is only ever a green update.
#
# The monthly pull request only raises what package.json lists, so a security fix
# for a package that comes in through another one would never arrive with it.
# "Dependabot security updates" is on in the repository settings for that, and the
# `security` groups below put every such fix for an ecosystem into one pull request
# rather than one per package. Security updates skip the cooldown.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Oslo
    # A release has to be a week old before it is proposed. A hijacked package is
    # usually caught and pulled within days, so this keeps one from reaching the
    # site through an update.
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 is the native rewrite, and typescript-eslint cannot load it
      # yet: lint crashes before it checks anything. Remove this once
      # typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # better-sqlite3 13 ends up in the Worker with a top-level `require.main`
      # check, and Cloudflare refuses to publish it ("require is not defined"). It
      # is only used by @nuxt/content in local development, so 12 is enough.
      - dependency-name: better-sqlite3
        update-types: [version-update:semver-major]
    groups:
      all:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Oslo
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
